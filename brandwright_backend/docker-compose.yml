version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: brandwright_postgres
    environment:
      POSTGRES_USER: brandwright
      POSTGRES_PASSWORD: brandwright_password
      POSTGRES_DB: brandwright_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandwright -d brandwright_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: brandwright_redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: brandwright_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brandwright_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://brandwright:brandwright_password@postgres:5432/brandwright_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=supersecretjwtkeybrandwright2026
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadminpassword
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
