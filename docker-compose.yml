services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-brandwright_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in .env} -d ${POSTGRES_DB:-brandwright_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: rustfs/rustfs:latest
    command: ["server", "/data", "--console-enable", "--console-address", ":9001"]
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-brandwright_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DEMO_MODE: ${DEMO_MODE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      REVIEW_ASYNC: ${REVIEW_ASYNC:-false}
      BRANDWRIGHT_MODEL_MODE: ${BRANDWRIGHT_MODEL_MODE:-mock}
      BRANDWRIGHT_ANTHROPIC_API_KEY: ${BRANDWRIGHT_ANTHROPIC_API_KEY:-}
      RETRIEVER: ${RETRIEVER:-pgvector}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      REVIEW_JOB_TIMEOUT_SECONDS: ${REVIEW_JOB_TIMEOUT_SECONDS:-300}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "reviews"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-brandwright_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      BRANDWRIGHT_MODEL_MODE: ${BRANDWRIGHT_MODEL_MODE:-mock}
      BRANDWRIGHT_ANTHROPIC_API_KEY: ${BRANDWRIGHT_ANTHROPIC_API_KEY:-}
      RETRIEVER: ${RETRIEVER:-pgvector}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      REVIEW_ASYNC: ${REVIEW_ASYNC:-false}
      REVIEW_JOB_TIMEOUT_SECONDS: ${REVIEW_JOB_TIMEOUT_SECONDS:-300}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  minio_data:
